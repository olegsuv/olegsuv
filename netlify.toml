# olegsuv.dev: a static CV, no build step. The React site it replaced is kept
# at archive.olegsuv.dev (branch "archive").
[build]
  publish = "site"
  command = ""

# The .netlify.app address lands on olegsuv.dev (www already does, as a domain alias).
[[redirects]]
  from = "https://olegsuv.netlify.app/*"
  to = "https://olegsuv.dev/:splat"
  status = 301
  force = true

# Addresses from the old React site live on in the archive.
[[redirects]]
  from = "/messengers"
  to = "https://archive.olegsuv.dev/messengers"
  status = 301

[[redirects]]
  from = "/static/*"
  to = "https://archive.olegsuv.dev/static/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
